    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "BizTrade Africa",
            "alternateName": "BTA",
            "url": "/",
            "description": "All-in-one business management platform for African retail, wholesale, and multi-branch enterprises."
          },
          {
            "@type": "WebSite",
            "name": "BizTrade Africa",
            "url": "/",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "/businesses?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          },
          {
            "@type": "SoftwareApplication",
            "name": "BizTrade Africa",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "description": "Multi-tenant POS, inventory, sales, orders, finance, payroll, recruitment, and business directory platform.",
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "RWF"
            }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('biztrade_theme') || localStorage.getItem('bizflow_theme') || 'system';
          var isDark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>

  <body class="bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-200 selection:bg-sky-100 selection:text-sky-900 dark:selection:bg-sky-900 dark:selection:text-sky-100">
